# Kustomize component that turns the vanilla base/thanos-store into a sharded
# store-gateway. Consume it alongside base/thanos-store:
#
#   resources:
#     - github.com/utilitywarehouse/thanos-manifests/base/thanos-store?ref=MYREF
#   components:
#     - github.com/utilitywarehouse/thanos-manifests/thanos-store-sharded?ref=MYREF
#
# See README.md in this directory for the full consumption guide (required
# overlay bits, env defaults, and how the sharding works).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
configMapGenerator:
  - name: shard-entrypoint
    files:
      - entrypoint.sh
    options:
      disableNameSuffixHash: true
patches:
  - path: shard-patch.yaml
