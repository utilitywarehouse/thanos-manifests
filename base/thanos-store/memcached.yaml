---
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: thanos-store-memcached
  labels:
    app.kubernetes.io/instance: thanos-store
    app.kubernetes.io/name: memcached
    app.kubernetes.io/version: 1.6.45
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: thanos-store
      app.kubernetes.io/name: memcached
  policyTypes:
    - Ingress
    - Egress
  egress:
    - {}
  ingress:
    - ports:
        - port: 11211
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: thanos-store-memcached
  labels:
    app.kubernetes.io/instance: thanos-store
    app.kubernetes.io/name: memcached
    app.kubernetes.io/version: 1.6.45
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: thanos-store
      app.kubernetes.io/name: memcached
---
apiVersion: v1
kind: ServiceAccount
automountServiceAccountToken: false
metadata:
  name: thanos-store-memcached
  labels:
    app.kubernetes.io/instance: thanos-store
    app.kubernetes.io/name: memcached
    app.kubernetes.io/version: 1.6.45
---
apiVersion: v1
kind: Service
metadata:
  name: thanos-store-memcached
  labels:
    app.kubernetes.io/instance: thanos-store
    app.kubernetes.io/name: memcached
    app.kubernetes.io/version: 1.6.45
spec:
  type: ClusterIP
  ports:
    - name: memcache
      port: 11211
      targetPort: memcache
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/instance: thanos-store
    app.kubernetes.io/name: memcached
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: thanos-store-memcached
  labels:
    app.kubernetes.io/instance: thanos-store
    app.kubernetes.io/name: memcached
    app.kubernetes.io/version: 1.6.45
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: thanos-store
      app.kubernetes.io/name: memcached
  replicas: 2
  podManagementPolicy: Parallel
  serviceName: thanos-store-memcached
  updateStrategy:
    rollingUpdate: {}
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: thanos-store
        app.kubernetes.io/name: memcached
        app.kubernetes.io/version: 1.6.45
    spec:
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/instance: thanos-store
                    app.kubernetes.io/name: memcached
                topologyKey: kubernetes.io/hostname
              weight: 1
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: Always
      serviceAccountName: thanos-store-memcached
      containers:
        - name: memcached
          image: registry-1.docker.io/library/memcached:1.6.45
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsGroup: 1001
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
          args:
            - -m
            - "9216"
            - --memory-file=/cache-state/memory_file
          ports:
            - name: memcache
              containerPort: 11211
          livenessProbe:
            failureThreshold: 6
            initialDelaySeconds: 30
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
            tcpSocket:
              port: memcache
          readinessProbe:
            failureThreshold: 6
            initialDelaySeconds: 5
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 3
            tcpSocket:
              port: memcache
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -ec
                  - |
                    kill -USR1 1
                    sleep 60
          resources:
            requests:
              cpu: 0m
              memory: 8Mi
            limits:
              cpu: 2
              memory: 3Gi
          volumeMounts:
            - name: data
              mountPath: /cache-state
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/instance: thanos-store
          app.kubernetes.io/name: memcached
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
